<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&display=swap">
<style>
:root{--bg:#FBF8F1;--card:#fff;--line:#E8E3D4;--moss:#4A5D3A;--moss2:#37472B;--sage:#A9BB9B;--sage2:#E3EAD9;--ink:#2A3024;--mute:#7A8070;--gold:#D9A441;--goldbg:#FBEFD2;--red:#B5533C;--r:16px;--navbg:rgba(251,248,241,.96);--statusbg:#37472B}
:root[data-theme=dark]{--statusbg:#121A2B;--bg:#121A2B;--card:#1B2539;--line:#2D3A55;--moss:#B96A38;--moss2:#CAD8EE;--sage:#5F7396;--sage2:#243250;--ink:#EAEBF0;--mute:#8E9DB8;--gold:#E3B25D;--goldbg:#3A3022;--red:#F2807A;--navbg:rgba(18,26,43,.96);color-scheme:dark}
:root[data-theme=dark] .chip.g{color:#F0C48A}:root[data-theme=dark] #toast{background:#E6EBF5;color:#0F1724}:root[data-theme=dark] .fab{background:#7FB2E5;color:#0F1724;box-shadow:0 6px 18px rgba(0,0,0,.45)}:root[data-theme=dark] .owe{background:#22314F;border-color:#3A4C73}:root[data-theme=dark] .owe .muted{color:#AFC0DD}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif}
#app{position:fixed;top:0;bottom:0;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px var(--padb,calc(env(safe-area-inset-bottom,0px) + 172px))}
h1{font:600 24px "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em;margin:4px 0 14px;color:var(--moss2)}
.muted{color:var(--mute);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.big{font:500 26px/1.15 "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--moss2);margin:6px 0 0}.big.neg{color:var(--red)}
.bar{height:8px;background:var(--sage2);border-radius:9px;margin:10px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--moss);border-radius:9px}.bar i.warn{background:var(--gold)}
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month b{font:600 18px "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.005em}.month button{width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:15px;line-height:1;color:var(--moss)}
.owe{background:var(--moss);color:#fff;border-color:var(--moss)}.owe .muted{color:#D5E0C9}.owe .big{color:#fff}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;font-family:inherit;background:var(--moss);color:#fff;min-height:44px}
.btn.alt{background:var(--sage2);color:var(--moss2)}.btn.ghost{background:none;color:var(--red)}.btn.sm{padding:8px 12px;min-height:36px;font-size:13px}
.item{display:flex;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.item .t{flex:1;min-width:0}.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{text-align:right;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--sage2);color:var(--moss2);margin-right:4px}.chip.g{background:var(--goldbg);color:#8A6212}
.empty{text-align:center;padding:36px 12px;color:var(--mute)}
nav{position:fixed;left:12px;right:12px;bottom:max(4px,calc(env(safe-area-inset-bottom,0px) - 30px));max-width:536px;margin:0 auto;background:var(--navbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:26px;box-shadow:0 8px 24px rgba(42,48,36,.18);display:flex;padding:6px 6px calc(6px + max(0px,env(safe-area-inset-bottom,0px) - 22px));z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-weight:400;font-size:13px;font-family:system-ui,-apple-system,sans-serif;color:var(--mute);border-radius:20px}nav button.on{background:var(--sage2);color:var(--moss2)}
nav button span{display:block;font-size:23px;line-height:1.2}.brand{font:400 42px/1 'Chewy','Fredoka','Marker Felt','Chalkboard SE','Comic Sans MS',cursive,sans-serif;letter-spacing:.5px;color:var(--moss2);display:flex;align-items:center;gap:10px;margin:0}.bk{width:1.2em;height:1.2em;border-radius:50%;background:var(--moss);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}.bk svg{width:.74em;height:.74em}
.fab{position:fixed;right:18px;bottom:var(--fabb,calc(env(safe-area-inset-bottom,0px) + 100px));width:58px;height:58px;padding:0;border-radius:50%;border:0;align-items:center;justify-content:center;background:var(--gold);color:#3b2a05;font-weight:700;font-size:15px;font-family:inherit;box-shadow:0 6px 16px rgba(55,71,43,.25);z-index:4}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;font-family:inherit;color:var(--ink);min-height:46px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--moss);outline-offset:1px}
.seg{display:flex;gap:6px}.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 4px;font-weight:600;font-size:14px;font-family:inherit;color:var(--ink);min-height:44px}.seg button.on{background:var(--moss);color:#fff;border-color:var(--moss)}
#sheet{position:fixed;inset:0;padding-bottom:var(--clip,0px);background:rgba(42,48,36,.45);display:none;align-items:flex-end;z-index:10}#sheet.open{display:flex}
#sheet .in{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:92%;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(116px + var(--clip,0px));transform:translateX(-50%);background:var(--moss2);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}#toast.on{opacity:1}
details summary{cursor:pointer;color:var(--moss);font-size:13px;margin-top:8px}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.grid2>div{min-width:0}input[type=date]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;height:46px;text-align:left}input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}.stack{flex:1;display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--sage2)}.stack i{display:block;height:100%}.bar i.over{background:var(--red)}.sw .item{border-bottom:0;padding-bottom:4px}.top{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:0 0 16px}.apptitle{font:600 19px Georgia,serif;color:var(--moss2)}.pill{border:1px solid var(--line);background:var(--card);color:var(--moss2);border-radius:99px;padding:8px 14px;font-size:14px;font-family:inherit;min-height:38px}.pill.on{background:var(--moss);color:#fff;border-color:var(--moss)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips .chip{margin:0;display:inline-flex;align-items:center;font-size:13px;padding:3px 10px}.chips .chip b{padding:2px 6px!important;margin-right:-6px;line-height:1!important}.chips+label{margin-top:14px}.divider{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--moss),var(--line) 65%,transparent);margin:0 0 14px}
.tg{width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;padding:0;flex:none}.tg i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}.tg.on{background:var(--moss)}.tg.on i{transform:translateX(22px)}
.help{width:30px;height:30px;flex:none;border-radius:50%;border:0;background:var(--gold);color:#3b2a05;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 0 0 3px var(--goldbg)}.gd{margin:16px 0 0}.gd b{display:block;margin-bottom:2px}.gd span{color:var(--mute);font-size:14px}.gd ol{margin:6px 0 0;padding-left:20px}.gd li{margin:4px 0}
.lbl{display:flex;align-items:center;gap:8px}.ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-style:normal;background:rgba(255,255,255,.2)}.owe2 .ic{background:rgba(55,71,43,.12)}:root[data-theme=dark] .owe2 .ic{background:rgba(255,255,255,.18)}.owe2{background:#C9D6BD;border-color:#C9D6BD;color:var(--moss2)}.owe2 .muted{color:#3F5232}.owe2 .big{color:var(--moss2)}:root[data-theme=dark] .owe2{background:#3F5A8A;border-color:#5775A8}:root[data-theme=dark] .owe2 .muted{color:#BCCBE6}:root[data-theme=dark] .owe2 .big{color:#fff}
.pill.cir{width:42px;height:42px;min-height:42px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app"></div>
<button class="fab" id="fab" aria-label="Add expense" title="Add expense" onclick="openSheet()"><svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true"><path d="M10.8 4.5a1.2 1.2 0 0 1 2.4 0v6.3h6.3a1.2 1.2 0 0 1 0 2.4h-6.3v6.3a1.2 1.2 0 0 1-2.4 0v-6.3H4.5a1.2 1.2 0 0 1 0-2.4h6.3z"/></svg></button>
<nav id="nav"></nav>
<div id="sheet" onclick="if(event.target==this)closeSheet()"><div class="in" id="form"></div></div>
<div id="toast"></div>
<script>
const K='monthly-tracker-v1';let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
const CUR={PHP:['₱'],USD:['$'],EUR:['€'],GBP:['£'],JPY:['¥'],CNY:['CN¥'],KRW:['₩'],INR:['₹'],AUD:['A$'],CAD:['C$'],NZD:['NZ$'],SGD:['S$'],HKD:['HK$'],TWD:['NT$'],THB:['฿'],VND:['₫'],IDR:['Rp'],MYR:['RM'],AED:['AED '],SAR:['SAR '],QAR:['QAR '],KWD:['KD '],CHF:['CHF '],SEK:['kr '],NOK:['kr '],DKK:['kr '],PLN:['zł '],CZK:['Kč '],TRY:['₺'],RUB:['₽'],UAH:['₴'],ILS:['₪'],ZAR:['R '],NGN:['₦'],KES:['KSh '],EGP:['E£'],BRL:['R$'],MXN:['MX$'],ARS:['AR$'],CLP:['CL$'],COP:['CO$'],PEN:['S/'],PKR:['₨'],BDT:['৳'],LKR:['Rs ']};
S=Object.assign({sal:[0,0],cur:'₱',partner:'Partner',exp:[],arch:[],methods:[],alloc:{},types:[]},S);
const BASE=['Cash'];const methods=x=>{const a=[...BASE,...S.methods];if(x&&!a.includes(x))a.push(x);return a};
if(!CUR[S.code])S.code=Object.keys(CUR).find(k=>CUR[k][0]==S.cur)||'PHP';S.cur=CUR[S.code][0];
let DB=null,pt=null,booting=true;
function push(){if(!DB||booting)return;clearTimeout(pt);pt=setTimeout(()=>{DB.doc('tracker/state').set({json:JSON.stringify(S),ts:S.ts||0}).catch(()=>{})},500)}
const save=()=>{if(!booting)S.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}push()};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
if(!S.sals||typeof S.sals!='object'){S.sals={};if(S.sal&&(S.sal[0]||S.sal[1]))S.sals[today().slice(0,7)]=S.sal.slice();save()}
if(!S.allocs||typeof S.allocs!='object'){S.allocs={};if(S.alloc&&Object.keys(S.alloc).length)S.allocs['0000-00']=S.alloc;save()}
const allocOf=(c,k)=>{k=k||vm;let b=null;for(const m in S.allocs){if(m<=k&&S.allocs[m]&&c in S.allocs[m]&&(b===null||m>b))b=m}return b===null?0:+S.allocs[b][c]||0};
let setOpen=false,tab='budget',vm=today().slice(0,7),editId=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>S.cur+(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const mine=e=>e.as=='me'?e.amt:e.as=='p'?0:e.amt/2, theirs=e=>e.amt-mine(e);
const per=e=>+e.date.slice(8,10)<=15?0:1;
const bal=l=>l.reduce((t,e)=>t+(e.paid?0:(e.by=='me'?theirs(e):-mine(e))),0);
const sum=(l,f)=>l.reduce((t,e)=>t+f(e),0);
const dfmt=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
const P=()=>esc(S.partner||'Partner');
const asLabel=e=>e.as=='both'?'Split 50/50':e.as=='me'?'Just me':'Just '+P();
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}

function rowHtml(e,click){return `<div class=item ${click?`onclick="openSheet('${e.id}')" role=button tabindex=0`:''}><div class=t><b>${esc(e.title)}</b><span class=muted>${dfmt(e.date)} · ${e.pay}</span><div style="margin-top:4px"><span class="chip ${e.as=='both'?'g':''}">${asLabel(e)}</span><span class=chip>${esc(tOf(e))}</span><span class=chip>Paid by ${e.by=='me'?'me':P()}</span></div></div><div class=amt>${fmt(e.amt)}${e.as!='me'?`<div class=muted>my share ${fmt(mine(e))}</div>`:''}</div></div>`}

function budget(){
 const l=S.exp.filter(e=>e.date.startsWith(vm)),[y,m]=vm.split('-'),name=new Date(y,m-1,1).toLocaleString(undefined,{month:'long',year:'numeric'});
 const cards=[0,1].map(p=>{const sp=sum(l.filter(e=>per(e)==p),mine),sal=+(S.sals[vm]||[])[p]||0,left=sal-sp,pct=sal>0?Math.min(100,sp/sal*100):(sp>0?100:0);
 return `<div class=card><div class=row><b>${p?'30th payday':'15th payday'}</b><span class=muted>${p?'Expenses 16th–end':'Expenses 1st–15th'}</span></div><div class="big ${left<0?'neg':''}">${fmt(left)}</div><div class=muted>Remaining balance</div><div class=bar><i style="width:${pct}%" class="${pct>85?'warn':''}"></i></div><div class=muted>Spent: ${fmt(sp)}</div></div>`}).join('');
 const b=bal(S.exp);
 return `<div class=month style="margin-top:38px"><button aria-label="Previous month" onclick="mv(-1)">‹</button><b>${name}</b><button aria-label="Next month" onclick="mv(1)">›</button></div>${cards}
 <div class=card><div class=row><span>Monthly Spending</span><b>${fmt(sum(l,mine))}</b></div><div class=row style="margin-top:6px"><span class=muted>Total paid out (all shares)</span><span class=muted>${fmt(sum(l,e=>e.amt))}</span></div></div>
 <div style='display:flex;gap:10px;margin-bottom:12px'><div class='card owe' style='flex:1;min-width:0;margin:0;padding:18px 16px;min-height:108px'><div class=lbl><i class=ic><svg viewBox='0 0 24 24' width='16' height='16' fill='currentColor' aria-hidden='true'><path d='M16.2 6.3a1.6 1.6 0 0 1 2.3 2.3L10.4 16.7H15a1.6 1.6 0 0 1 0 3.2H7a1.8 1.8 0 0 1-1.8-1.8v-8a1.6 1.6 0 0 1 3.2 0v4.6z'/></svg></i><span class=muted>Owed to you</span></div><div class=big style='font-size:24px;margin-top:14px'>${fmt(owe(S.exp,'me'))}</div></div><div class='card owe2' style='flex:1;min-width:0;margin:0;padding:18px 16px;min-height:108px'><div class=lbl><i class=ic><svg viewBox='0 0 24 24' width='16' height='16' fill='currentColor' aria-hidden='true'><path transform='rotate(180 12 12)' d='M16.2 6.3a1.6 1.6 0 0 1 2.3 2.3L10.4 16.7H15a1.6 1.6 0 0 1 0 3.2H7a1.8 1.8 0 0 1-1.8-1.8v-8a1.6 1.6 0 0 1 3.2 0v4.6z'/></svg></i><span class=muted>You owe</span></div><div class=big style='font-size:24px;margin-top:14px'>${fmt(owe(S.exp,'p'))}</div></div></div>
 `}

function settings(){
 const [y,m]=vm.split('-'),name=new Date(y,m-1,1).toLocaleString(undefined,{month:'long',year:'numeric'});
 return `<h1>Settings</h1><div class=card><div class=row><div><b>Dark mode</b><div class=muted>Easier on the eyes at night</div></div><button class="tg ${S.dark?'on':''}" role=switch aria-checked="${!!S.dark}" aria-label="Dark mode" onclick="toggleDark()"><i></i></button></div></div><div class=month><button aria-label="Previous month" onclick="mv(-1)">‹</button><b>${name}</b><button aria-label="Next month" onclick="mv(1)">›</button></div><div class=card>
 <div class=muted style='margin-top:10px'>Salary for ${name}. Each month has its own.</div><div class=grid2><div><label>15th Cycle</label><input type=number inputmode=decimal value="${(S.sals[vm]||[])[0]||''}" onchange="setS(0,this.value)"></div><div><label>30th Cycle</label><input type=number inputmode=decimal value="${(S.sals[vm]||[])[1]||''}" onchange="setS(1,this.value)"></div></div>
 <div class=grid2><div><label>Partner's name</label><input value="${esc(S.partner)}" onchange="S.partner=this.value.trim()||'Partner';save();rr()"></div><div><label>Currency</label><select onchange='S.code=this.value;S.cur=CUR[this.value][0];save();rr()'>${Object.keys(CUR).map(k=>`<option value=${k} ${S.code==k?'selected':''}>${CUR[k][0].trim()} ${k}</option>`).join('')}</select></div></div><label>Payment methods</label><div class=row style='gap:8px'><input id=nm placeholder='e.g. BPI Credit Card' maxlength=30><button class='btn sm' onclick='addM()'>Add</button></div><div class=chips>${S.methods.map((m,i)=>`<span class=chip>${esc(m)} <b onclick='delM(${i})' role=button aria-label='Remove ${esc(m)}' style='cursor:pointer;font-size:16px;line-height:1;padding:6px 8px'>×</b></span>`).join('')||`<span class=muted>Cash is built in. Add your debit cards, credit cards and e-wallets here.</span>`}</div><label>Expense types</label><div class=row style='gap:8px'><input id=nt placeholder='e.g. Pets' maxlength=30><button class='btn sm' onclick='addT()'>Add</button></div><div class=chips><span class=chip>Groceries</span>${S.types.map((m,i)=>`<span class=chip>${esc(m)} <b onclick='delT(${i})' role=button aria-label='Remove ${esc(m)}' style='cursor:pointer;font-size:16px;line-height:1;padding:6px 8px'>×</b></span>`).join('')}</div></div>`}

function expenses(){
 const l=[...S.exp].sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class=row><h1>Expenses</h1>${l.length?'<button class="btn alt sm" onclick="archiveAll()">Archive all</button>':''}</div>
 <div class=card><div class=row><span class=muted>${l.length} active · total</span><b>${fmt(sum(l,e=>e.amt))}</b></div></div>
 <div class=card style="padding:6px 12px">${l.length?l.map(e=>rowHtml(e,1)).join(''):'<div class=empty>No expenses yet.<br>Tap “Add expense” to log your first one.</div>'}</div>`}

function split(){
 const l=S.exp.filter(rel).sort((a,b)=>(a.paid?1:0)-(b.paid?1:0)||b.date.localeCompare(a.date)),b=bal(S.exp);
 return `<h1>Shared with ${P()}</h1><div class='card owe'><div class=muted>${P()} needs to pay me</div><div class=big>${fmt(owe(S.exp,'me'))}</div></div><div class=card style='padding:10px 14px'><div class=row><span class=muted>I need to pay ${P()}</span><span>${fmt(owe(S.exp,'p'))}</span></div></div>
 <button class=btn style="width:100%;margin-bottom:12px" onclick="share()">Share summary with ${P()}</button>
 <div class=card style="padding:6px 12px">${l.length?l.map(sRow).join(''):'<div class=empty>Nothing shared yet.<br>Choose “Split 50/50” or “Just '+P()+'” when adding an expense.</div>'}</div>`}

function archive(){
 return `<h1>Archive</h1><p class=muted style="margin-top:-6px">Archived expenses are kept here and no longer count toward your budget or balance.</p>`+

const HELPBTN="<button class=help aria-label='How to use this app' title='How to use this app' onclick='openHelp()'><span style='font:800 17px/1 system-ui,-apple-system,sans-serif'>?</span></button>";
const topbar=()=>`<div class=top style='justify-content:${tab=='settings'||tab=='budget'?'space-between':'flex-end'};align-items:${tab=='budget'?'flex-start':'center'}'>${tab=='settings'?HELPBTN:tab=='budget'?BRAND:''}<div style='display:flex;gap:8px'><button class='pill cir ${tab=='insights'?'on':''}' aria-label='Insights' title='Insights' onclick='go("insights")'><svg viewBox='0 0 24 24' width='22' height='22' fill='currentColor' aria-hidden='true'><rect x='3.5' y='12' width='4.8' height='8.5' rx='2' opacity='.5'/><rect x='9.6' y='3.5' width='4.8' height='17' rx='2'/><rect x='15.7' y='8.5' width='4.8' height='12' rx='2' opacity='.75'/></svg></button><button class='pill cir ${tab=='archive'?'on':''}' aria-label='Archive' title='Archive' onclick='go("archive")'><svg viewBox='0 0 24 24' width='22' height='22' fill='currentColor' aria-hidden='true'><rect x='2.5' y='3.5' width='19' height='6' rx='2.4' opacity='.5'/><path fill-rule='evenodd' d='M4.2 11.2h15.6V17a3.3 3.3 0 0 1-3.3 3.3h-9A3.3 3.3 0 0 1 4.2 17z M9.6 13.6h4.8a1 1 0 0 1 0 2H9.6a1 1 0 0 1 0-2z'/></svg></button></div></div>`;
function layout(){const n=$('#nav');if(!n)return;const t=n.offsetHeight+(parseFloat(getComputedStyle(n).bottom)||0),r=document.documentElement.style;r.setProperty('--fabb',(t+14)+'px');r.setProperty('--padb',(t+14+58+14)+'px')}
addEventListener('resize',()=>layout());
let CLIP=0;function watchClip(){try{if(!('IntersectionObserver' in window))return;const s=document.createElement('div');s.style.cssText='position:fixed;left:0;top:0;width:2px;height:100%;opacity:0;pointer-events:none';document.body.appendChild(s);const th=[];for(let i=0;i<=100;i++)th.push(i/100);new IntersectionObserver(es=>{const e=es[es.length-1];let c=innerHeight-e.intersectionRect.bottom;if(e.intersectionRatio<=0||!(c>24))c=0;c=Math.min(Math.round(c),260);if(c!==CLIP){CLIP=c;document.documentElement.style.setProperty('--clip',c+'px');layout()}},{threshold:th}).observe(s)}catch(e){}}
function applyTheme(){const d=!!S.dark;document.documentElement.setAttribute('data-theme',d?'dark':'light');const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#121A2B':'#FBF8F1'}
function openHelp(){$('#form').innerHTML=`<div class=row><h1 style='margin:0'>How to use</h1><button class='btn alt sm' onclick='closeSheet()'>Close</button></div>
<div class=card style='margin-top:14px;background:var(--goldbg);border-color:var(--gold)'><b>Archive every last day of the month</b><div style='margin-top:6px'>Do this on the last day of each month so the new month starts fresh.</div><ol style='margin:8px 0 0;padding-left:20px'><li style='margin:4px 0'>Open the <b style='display:inline'>Shared</b> tab and tap <b style='display:inline'>Mark as paid</b> on anything already settled. Archived expenses no longer count toward what your partner owes.</li><li style='margin:4px 0'>Open the <b style='display:inline'>Expenses</b> tab and tap <b style='display:inline'>Archive all</b>.</li><li style='margin:4px 0'>Your list and budget start empty. Nothing is lost: find it under <b style='display:inline'>Archive</b> (top right) and tap <b style='display:inline'>Restore</b> to bring it back.</li></ol></div>
<div class=gd><b>Add an expense</b><span>Tap the round + button. Fill in what it was for, the expense type, amount, date, how you paid, who paid and who it is for (just you, split 50/50, or just your partner).</span></div>
<div class=gd><b>Budget tab</b><span>Shows what is left from each salary. The 15th cycle covers expenses dated the 1st to the 15th. The 30th cycle covers the 16th to the end of the month. Enter both salaries for each month in Settings.</span></div>
<div class=gd><b>Shared tab</b><span>Lists expenses split with your partner and what each of you owes. Tap Mark as paid when settled, or Share summary to send the breakdown.</span></div>
<div class=gd><b>Plan tab</b><span>Set a monthly amount for each expense type. New months start with your latest amounts until you change them.</span></div>
<div class=gd><b>Insights (top right)</b><span>Compare spending with your plan, see the last 6 months by expense type and which payment method you use most. Switch on Include archived to count archived months.</span></div>
<div class=gd><b>Settings</b><span>Set salaries, partner name and currency. Add your own payment methods and expense types, and turn dark mode on or off.</span></div>
<div class=gd><b>Back up your data</b><span>In Archive, tap Export backup now and then. Import backup restores it if anything goes wrong.</span></div>`;$('#sheet').classList.add('open')}
function toggleDark(){S.dark=!S.dark;save();applyTheme();rr()}
function render(){CN=[...types(),'Other'];applyTheme();
 $('#nav').innerHTML=T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[2]}</span>${t[1]}</button>`).join('');
 $('#app').innerHTML=topbar()+{budget,expenses,split,plan,archive,insights,settings}[tab]();
 $('#fab').style.display=['archive','insights','plan','settings'].includes(tab)?'none':'flex';layout()}
function go(t){tab=t;render();$('#app').scrollTop=0}
function rr(){const a=$('#app'),y=a.scrollTop;render();a.scrollTop=y}
function mv(d){const[y,m]=vm.split('-').map(Number),x=new Date(y,m-1+d,1);vm=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');render()}

function openSheet(id){
 editId=id||null;const e=id?S.exp.find(x=>x.id==id):{title:'',amt:'',date:today(),pay:'Cash',by:'me',as:'me'};
 const sg=(k,o)=>`<div class=seg data-k=${k}>${o.map(([v,t])=>`<button type=button data-v=${v} class="${e[k]==v?'on':''}" onclick="pick(this)">${t}</button>`).join('')}</div>`;
 $('#form').innerHTML=`<div class=row><h1 style="margin:0">${id?'Edit expense':'New expense'}</h1><button class="btn alt sm" onclick="closeSheet()">Close</button></div>
 <label>What was it for?</label><input id=f-t value="${esc(e.title)}" placeholder="e.g. Groceries">
 <label>Expense type</label><select id=f-c><option value=''>Select type</option>${[...new Set([...types(),'Other',...(e.type?[e.type]:[])])].map(t=>`<option ${(e.type||(types().includes(catOf(e.title))?catOf(e.title):''))==t?'selected':''}>${esc(t)}</option>`).join('')}</select>
 <div class=grid2><div><label>Amount</label><input id=f-a type=number inputmode=decimal step=0.01 value="${e.amt}" placeholder="0.00"></div><div><label>Date spent</label><input id=f-d type=date value="${e.date}"></div></div>
 <label>Paid via <span style='color:var(--mute)'>(add more in Budget › Settings)</span></label><select id=f-p>${methods(e.pay).map(p=>`<option ${e.pay==p?'selected':''}>${esc(p)}</option>`).join('')}</select>
 <label>Who paid?</label>${sg('by',[['me','Me'],['p',S.partner||'Partner']])}
 <label>Who is it for?</label>${sg('as',[['me','Just me'],['both','Split 50/50'],['p','Just '+(S.partner||'Partner')]])}
 <div id=f-n class=muted style="margin-top:10px"></div>
 <div class=row style="margin-top:16px;gap:10px">${id?'<button class="btn ghost" onclick="del(this)">Delete</button>':''}<button class=btn style="flex:1" onclick="saveExp()">${id?'Save changes':'Add expense'}</button></div>`;
 $('#sheet').classList.add('open');['f-a','f-t'].forEach(i=>$('#'+i).addEventListener('input',note));note()}
function closeSheet(){$('#sheet').classList.remove('open')}
function pick(b){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');note()}
const sv=k=>document.querySelector(`.seg[data-k=${k}] .on`).dataset.v;
function note(){const a=+$('#f-a').value||0,as=sv('as'),by=sv('by');if(!a){$('#f-n').textContent='';return}
 const my=as=='me'?a:as=='p'?0:a/2,th=a-my;
 $('#f-n').textContent=`Your share ${fmt(my)} · ${S.partner||'Partner'}'s share ${fmt(th)}`+(by=='me'&&th?` — they owe you ${fmt(th)}`:by=='p'&&my?` — you owe ${fmt(my)}`:'')}
function saveExp(){
 const title=$('#f-t').value.trim(),amt=+$('#f-a').value,date=$('#f-d').value;
 if(!title)return toast('Add a short description');if(!$('#f-c').value)return toast('Pick an expense type');if(!(amt>0))return toast('Enter an amount above 0');if(!date)return toast('Pick a date');
 const e={id:editId||Date.now().toString(36),title,amt,date,type:$('#f-c').value,paid:editId?!!(S.exp.find(x=>x.id==editId)||{}).paid:false,pay:$('#f-p').value,by:sv('by'),as:sv('as')};
 if(editId)S.exp=S.exp.map(x=>x.id==editId?e:x);else S.exp.push(e);
 save();vm=date.slice(0,7);closeSheet();render();toast(editId?'Changes saved':'Expense added')}
let armE=false;function del(b){if(!armE){armE=true;b.textContent='Tap again to confirm';setTimeout(()=>{armE=false;if(b.isConnected)b.textContent='Delete'},3000);return}armE=false;S.exp=S.exp.filter(x=>x.id!=editId);save();closeSheet();render();toast('Expense deleted')}

function archiveAll(){
 const lb=new Date().toLocaleString(undefined,{month:'long',year:'numeric'})+' expenses';
 S.arch.unshift({id:Date.now().toString(36),label:lb.trim()||'Archive',at:today(),list:S.exp});S.exp=[];save();render();toast('Archived. Restore it anytime from the Archive tab')}
function restore(id){const a=S.arch.find(x=>x.id==id);S.exp=S.exp.concat(a.list);S.arch=S.arch.filter(x=>x.id!=id);save();render();toast('Expenses restored')}
let armId=null;function delArch(id,b){if(armId!=id){armId=id;b.textContent='Tap again to delete';setTimeout(()=>{armId=null;if(b.isConnected)b.textContent='Delete forever'},3000);return}armId=null;S.arch=S.arch.filter(x=>x.id!=id);save();render()}

async function share(){
 const l=S.exp.filter(e=>rel(e)&&!e.paid),b=bal(S.exp);
 const t=`Shared expenses\n${b>=0?(S.partner||'Partner')+' owes me':'I owe '+(S.partner||'Partner')}: ${fmt(Math.abs(b))}\n\n`+l.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`${dfmt(e.date)} · ${e.title} · ${fmt(e.amt)} (${e.pay}, paid by ${e.by=='me'?'me':S.partner}, ${asLabel(e).replace(/<[^>]*>/g,'')}) → ${S.partner}'s share ${fmt(theirs(e))}`).join('\n');
 try{if(navigator.share){await navigator.share({title:'Shared expenses',text:t});return}}catch(e){if(e.name=='AbortError')return}
 try{await navigator.clipboard.writeText(t);toast('Summary copied — paste it in a message')}catch(e){prompt('Copy this summary:',t)}}
async function backup(){try{const name='tally-backup-'+today()+'.json',blob=new Blob([JSON.stringify(S)],{type:'application/json'});const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});toast('Backup exported');return}catch(e){if(e.name=='AbortError')return}}const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>{URL.revokeObjectURL(u)},4000);toast('Backup exported')}catch(e){toast('Could not export backup')}}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.exp))throw 0;S=Object.assign({sal:[0,0],cur:'₱',partner:'Partner',exp:[],arch:[],methods:[],alloc:{},types:[]},d);if(!S.sals||typeof S.sals!='object'){S.sals={};if(S.sal&&(S.sal[0]||S.sal[1]))S.sals[today().slice(0,7)]=S.sal.slice()}if(!S.allocs||typeof S.allocs!='object'){S.allocs={};if(S.alloc&&Object.keys(S.alloc).length)S.allocs['0000-00']=S.alloc}if(!CUR[S.code])S.code=Object.keys(CUR).find(k=>CUR[k][0]==S.cur)||'PHP';S.cur=CUR[S.code][0];S.prevCleaned=true;save();render();toast('Backup loaded')}catch(e){toast('That file is not a valid backup')}};r.readAsText(f);i.value=''}
function reload(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&Array.isArray(d.exp)){S=Object.assign(S,d);render()}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#sheet').classList.contains('open'))reload()});
addEventListener('pageshow',e=>{if(e.persisted)reload()});addEventListener('storage',e=>{if(e.key==K)reload()});
cleanPrev();render();
booting=false;
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script></body></html>
